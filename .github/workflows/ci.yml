name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bat
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bat_scheduler
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bat" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://bat:ci-only-password@localhost:5432/bat_scheduler?schema=public
      TEST_DATABASE_URL: postgresql://bat:ci-only-password@localhost:5432/bat_scheduler_test?schema=public
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0123456789
      APP_URL: http://localhost:3000
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
