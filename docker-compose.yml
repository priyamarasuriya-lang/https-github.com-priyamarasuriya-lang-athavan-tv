# Local stack: PostgreSQL 16 + the app.
#   cp .env.example .env   (set POSTGRES_PASSWORD and SESSION_SECRET)
#   docker compose up --build
#   docker compose exec app npx tsx prisma/seed.ts     # optional demo data (development only)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bat_scheduler
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bat -d bat_scheduler']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bat:${POSTGRES_PASSWORD}@db:5432/bat_scheduler?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - media:/app/storage/uploads
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
  media:
